<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suara — Melur Kopi</title>
<style>
@font-face{font-family:"PJS";src:url("fonts/PlusJakartaSans.ttf") format("truetype-variations");font-weight:200 800;font-display:swap}
/* ============================================================================
   Style: "Superhuman — golden hour editorial dashboard", styles.refero.design.
   Adopted verbatim: parchment canvas never white · headlines at weight 460,
   never 700 · NO drop shadows, depth comes from layering photography ·
   16px radii · exactly ONE chromatic button fill · hairline warm-grey borders ·
   photography carries the emotional weight, UI floats over it.
   Adapted: the system's own maroon is replaced by Suara's coral, because the
   single chromatic fill should be the client's brand, not the reference's.
   ============================================================================ */
:root{
  --parch:#FBF7F0;        /* canvas — never white */
  --paper:#ffffff;        /* only for cards that must lift */
  --ink:#292827;          /* warm near-black, never #000 */
  --stone:#5b5854;        /* the only mid-grey — 6.0:1 on parchment; #6b6864 was 4.0 and failed */
  --mist:#E6E2DA;         /* hairlines */
  --coral:#E24A28;        /* the single chromatic fill */
  --coral-ink:#B8380F;    /* coral as TEXT — 5.4:1 on parchment */
  --coral-deep:#A8320F;   /* coral that can carry WHITE text — 5.9:1. Plain coral is 3.5 and fails. */
  --wash:#FBE7DE;         /* accent surface */
  --gold:#F6D089; --gold-wash:#FDF3DF;
  --green:#1D6B4C; --green-wash:#E7F1EB;
  --r:16px; --t:220ms cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--parch);color:var(--ink);font-family:"PJS",system-ui,sans-serif;
  font-size:16px;line-height:1.5;font-weight:460;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}

/* header — transparent, hairline, blur */
header{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  background:rgba(251,247,240,.82);border-bottom:1px solid var(--mist)}
.hd{display:flex;align-items:center;gap:12px;height:64px;max-width:1200px;margin:0 auto;padding:0 28px}
.hd svg{width:30px;height:30px}
.hd .nm{font-size:17px;font-weight:600;letter-spacing:-.01em}
.hd .sub{font-size:13px;color:var(--stone)}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:none;border:none;font:inherit;font-size:15px;color:var(--stone);
  padding:9px 14px;border-radius:8px;cursor:pointer;min-height:44px}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{background:var(--wash);color:var(--ink)}

/* ---------- the hero: photography carries it ---------- */
.hero{position:relative;border-radius:var(--r);overflow:hidden;margin-top:24px;min-height:420px;
  display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(30,22,16,.30) 0%,rgba(30,22,16,.05) 34%,rgba(30,22,16,.62) 100%)}
.hero__in{position:relative;z-index:2;padding:32px;color:#fff;width:100%}
.hero h1{font-size:clamp(34px,4.6vw,49px);font-weight:460;line-height:1.05;letter-spacing:-1.32px;
  max-width:19ch;text-shadow:0 1px 24px rgba(0,0,0,.25)}
.hero p{margin-top:12px;font-size:17px;opacity:.94;max-width:44ch}
.floats{position:absolute;right:28px;top:28px;z-index:3;display:grid;gap:10px;width:230px}
.float{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.5);border-radius:var(--r);padding:14px 16px}
.float b{display:block;font-size:26px;font-weight:460;line-height:1.1;letter-spacing:-.62px}
.float span{font-size:13px;color:var(--stone)}
.cta{display:inline-flex;align-items:center;gap:9px;margin-top:22px;min-height:48px;padding:13px 22px;
  background:var(--coral-deep);color:#fff;border:none;border-radius:var(--r);font:inherit;font-weight:600;
  font-size:16px;cursor:pointer;transition:background var(--t)}
.cta:hover{background:#8f2a0c}
.cta--ghost{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);color:#fff;margin-left:10px}

/* ---------- sections ---------- */
section{margin-top:64px}
h2{font-size:28px;font-weight:460;letter-spacing:-.62px;line-height:1.14}
.dek{color:var(--stone);margin-top:7px;max-width:60ch}
.head{display:flex;align-items:flex-end;gap:20px;margin-bottom:20px}
.head .r{margin-left:auto}

/* cards — white only when they lift, no shadows ever */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.post{background:var(--paper);border:1px solid var(--mist);border-radius:var(--r);overflow:hidden;
  text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0;transition:border-color var(--t)}
.post:hover{border-color:#cfc8bc}
.post .ph{position:relative;aspect-ratio:4/3;background:#eee}
.post .ph img{width:100%;height:100%;object-fit:cover}
.post .st{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.post .st--need{background:var(--coral-deep);color:#fff}
.post .st--ready{background:var(--gold);color:#4a3208}
.post .bd{padding:16px}
.post .day{font-size:13px;color:var(--stone)}
.post .cap{margin-top:6px;font-size:15px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* the question card — the product's whole argument */
.ask{background:var(--paper);border:1px solid var(--mist);border-radius:var(--r);padding:24px;
  display:grid;gap:18px}
.ask .k{font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--coral-ink)}
.ask h3{font-size:26px;font-weight:460;line-height:1.25;letter-spacing:-.4px}
.ask .nearly{border-left:2px solid var(--coral);padding-left:16px}
.ask .nearly em{font-style:normal;font-size:18px;color:var(--ink);display:block;line-height:1.4}
.ask .nearly span{font-size:14px;color:var(--stone);display:block;margin-top:6px}
.opts{display:grid;gap:9px}
.opt{display:block;width:100%;text-align:left;min-height:52px;padding:14px 18px;background:var(--parch);
  border:1px solid var(--mist);border-radius:12px;font:inherit;cursor:pointer;transition:border-color var(--t)}
.opt:hover{border-color:var(--ink)}
.opt b{font-weight:600;display:block}
.opt small{color:var(--stone);font-size:13.5px}
.opt.chosen{background:var(--green-wash);border-color:#b9d7c8}

.note{border-radius:12px;padding:14px 16px;font-size:14.5px;background:var(--gold-wash);color:#5a4212}
.note--ok{background:var(--green-wash);color:#17513a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.refuse{background:var(--paper);border:1px solid var(--mist);border-radius:var(--r);padding:20px}
.refuse .claim{font-size:17px;text-decoration:line-through;text-decoration-color:var(--coral);
  text-decoration-thickness:2px}
.refuse p{color:var(--stone);font-size:14.5px;margin-top:8px}
footer{margin:80px 0 0;background:var(--ink);color:#fff;border-radius:var(--r) var(--r) 0 0}
.ft{max-width:1200px;margin:0 auto;padding:36px 28px;display:flex;gap:20px;font-size:14px}
.ft span:last-child{margin-left:auto;opacity:.7}
@media(max-width:860px){
  /* phone: the photo is a band, the words sit under it on parchment.
     Text over a photo on a small screen is unreadable and the floats collided. */
  .hero{display:block;min-height:0;border-radius:var(--r);background:var(--paper);
    border:1px solid var(--mist);overflow:hidden}
  .hero img{position:static;height:210px;width:100%;object-fit:cover}
  .hero::after{display:none}
  .hero__in{position:static;color:var(--ink);padding:20px;text-shadow:none}
  .hero h1{font-size:29px;letter-spacing:-.5px;max-width:none;text-shadow:none}
  .hero p{opacity:1;color:var(--stone);font-size:15.5px}
  .floats{position:static;width:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    padding:0 20px 20px}
  .float{background:var(--parch);border:1px solid var(--mist);padding:12px;backdrop-filter:none}
  .float b{font-size:22px}.float span{font-size:12px;line-height:1.3;display:block}
  .cta{width:100%;justify-content:center;margin-top:16px}
  .cta--ghost{background:var(--parch);border:1px solid var(--mist);color:var(--ink);margin-left:0;margin-top:9px}
  .two{grid-template-columns:1fr}
  /* nav: one scrolling row, never wraps */
  header nav{margin-left:0;width:100%;overflow-x:auto;gap:2px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  header nav::-webkit-scrollbar{display:none}
  nav button{padding:9px 12px;font-size:14px;white-space:nowrap;flex:0 0 auto}
  .hd{height:auto;flex-wrap:wrap;padding:12px 18px 8px;gap:10px}
  .wrap{padding:0 18px}
  section{margin-top:44px}
  h2{font-size:24px}
}
</style></head><body>
<header><div class="hd">
  <svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#E24A28"/><stop offset="1" stop-color="#F6D089"/></linearGradient></defs>
    <g fill="none" stroke="url(#g)" stroke-linecap="round" transform="translate(256 364)">
    <path d="M -46 0 A 46 46 0 0 1 46 0" stroke-width="34"/><path d="M -104 0 A 104 104 0 0 1 104 0" stroke-width="30"/>
    <path d="M -160 0 A 160 160 0 0 1 160 0" stroke-width="26"/><path d="M -214 0 A 214 214 0 0 1 214 0" stroke-width="22"/></g></svg>
  <div><div class="nm">Suara</div><div class="sub">Melur Kopi · Bangsar</div></div>
  <nav id="nav"></nav>
</div></header>
<div class="wrap" id="main"></div>
<footer><div class="ft"><span>Suara — written from your file, never from a guess.</span>
  <span>Melur Kopi · Bangsar</span></div></footer>
<script>
const POSTS=[
 {id:1,img:"img/p1.jpg",day:"Monday 6:30am",st:"posted",cap:"We open at seven because someone always needs the first cup before the rest of the city is awake."},
 {id:2,img:"img/p2.jpg",day:"Tuesday 8:00am",st:"posted",cap:"Kaya toast and two soft eggs. Nothing complicated, nothing that needs explaining."},
 {id:3,img:"img/p3.jpg",day:"Wednesday 7:15am",st:"ready",cap:"The room before it fills. Same tables, same light, same corner of Bangsar."},
 {id:4,img:"img/p5.jpg",day:"Wednesday 4:30pm",st:"ready",cap:"Second half of the day. The grinder is still going and there is one more cup in it."},
 {id:5,img:"img/p4.jpg",day:"Thursday 8:00am",st:"need",cap:"Nasi lemak goes on at eight and stays until it doesn't."},
 {id:6,img:"img/p1.jpg",day:"Friday 9:00am",st:"ready",cap:"Friday morning. The papers, a cup, and no hurry about any of it."},
 {id:7,img:"img/p2.jpg",day:"Saturday 8:30am",st:"need",cap:"Weekend mornings run slower here."},
 {id:8,img:"img/p3.jpg",day:"Sunday 9:00am",st:"ready",cap:"Sunday. Kaya toast, soft eggs, and the papers."},
 {id:9,img:"img/p5.jpg",day:"Sunday 3:00pm",st:"ready",cap:"Late afternoon, one more cup before we close."}];
const ASKS=[
 {id:5,k:"One of two · needs you",h:"Is the kaya still made in-house?",
  nearly:"“Our kaya, made here every morning.”",
  why:"That is a claim about your kitchen. It is not in your file, so I stopped.",
  opts:[["Yes, we make it here","I will say so, plainly"],["No, we buy it in","I will never mention it"]],
  done:"Thursday's post now says it. Nothing else changed."},
 {id:7,k:"Two of two · needs you",h:"When does the nasi lemak actually run out?",
  nearly:"“Get there early — it goes fast.”",
  why:"That is a scarcity claim. I do not write those unless you have said them.",
  opts:[["Usually before noon","I will say most mornings, not always"],["It varies too much","I will leave it out"]],
  done:"Saturday's post now says most mornings it is gone before noon."}];
const REFUSED=[
 ["The best nasi lemak in Bangsar","A comparison against every other shop. Nothing in your file supports it."],
 ["Halal certified kitchen","A certification claim. It carries legal weight and it is not on your file."],
 ["Tables are filling fast — book now","Scarcity you have never told me is true."]];
let view="week", answered=new Set(), scheduled=new Set();
const el=id=>document.getElementById(id);
const TABS=[["week","This week"],["ask","Needs you"],["refused","What I didn't write"],["library","Library"]];
function nav(){el("nav").innerHTML=TABS.map(([k,t])=>{
  const n=k==="ask"?ASKS.filter(a=>!answered.has(a.id)).length:0;
  return `<button data-v="${k}" ${view===k?'aria-current="page"':''}>${t}${n?` · ${n}`:''}</button>`}).join("");}
function card(p){const st=answered.has(p.id)?"ready":p.st;
  const lbl=scheduled.has(p.id)?"Scheduled":st==="need"?"Needs you":st==="ready"?"Ready":"Posted";
  const cls=scheduled.has(p.id)?"":st==="need"?" st--need":st==="ready"?" st--ready":"";
  return `<button class="post" data-post="${p.id}"><div class="ph"><img src="${p.img}" alt="">
    <span class="st${cls}">${lbl}</span></div>
    <div class="bd"><div class="day">${p.day}</div><div class="cap">${p.cap}</div></div></button>`;}
function week(){
  const need=ASKS.filter(a=>!answered.has(a.id)).length;
  const ready=POSTS.filter(p=>(answered.has(p.id)||p.st==="ready")&&!scheduled.has(p.id)).length;
  el("main").innerHTML=`
  <div class="hero"><img src="img/p3.jpg" alt="">
    <div class="floats">
      <div class="float"><b>${need}</b><span>need a word from you</span></div>
      <div class="float"><b>${ready}</b><span>ready to go out</span></div>
      <div class="float"><b>${scheduled.size}</b><span>scheduled</span></div></div>
    <div class="hero__in">
      <h1>${need?`Nine posts. ${need===1?"One needs":"Two need"} a word from you.`:"Nine posts. Nothing left for you."}</h1>
      <p>Everything else claims nothing you haven't confirmed.</p>
      ${need?`<button class="cta" data-v="ask">Answer ${need===1?"it":"them"}</button>`
            :`<button class="cta" data-approve>Approve the ${ready} that claim nothing</button>`}
      <button class="cta cta--ghost" data-v="refused">See what I didn't write</button>
    </div></div>
  <section><div class="head"><div><h2>The week</h2>
    <p class="dek">Nine posts, written from your file. Tap one to read it in full.</p></div></div>
    <div class="grid">${POSTS.map(card).join("")}</div></section>`;}
function ask(){
  const open=ASKS.filter(a=>!answered.has(a.id));
  if(!open.length) return el("main").innerHTML=`
    <section><h2>Nothing needs you.</h2>
      <p class="dek">Both questions answered. The week is ready when you are.</p>
      <button class="cta" data-v="week" style="margin-top:20px">Back to the week</button></section>`;
  el("main").innerHTML=`<section style="margin-top:34px">
    <div class="two">${open.map(a=>`
      <div class="ask"><div class="k">${a.k}</div><h3>${a.h}</h3>
        <div class="nearly"><em>${a.nearly}</em><span>${a.why}</span></div>
        <div class="opts">${a.opts.map((o,i)=>
          `<button class="opt" data-ask="${a.id}" data-i="${i}"><b>${o[0]}</b><small>${o[1]}</small></button>`).join("")}</div>
        <div class="note note--ok" hidden id="d${a.id}">${a.done}</div></div>`).join("")}</div>
  </section>`;}
function refused(){el("main").innerHTML=`<section style="margin-top:34px">
  <h2>What I didn't write</h2>
  <p class="dek">Three lines I could have written this week and did not, because nothing in your file backs them up.</p>
  <div class="grid" style="margin-top:20px">${REFUSED.map(([c,w])=>
    `<div class="refuse"><div class="claim">${c}</div><p>${w}</p></div>`).join("")}</div>
  <div class="note" style="margin-top:18px">Every one of these is a line a normal tool would have published for you.</div>
  </section>`;}
function library(){el("main").innerHTML=`<section style="margin-top:34px">
  <h2>Your photos</h2><p class="dek">What I write from. Add one and it is available to every post.</p>
  <div class="grid" style="margin-top:20px">${["p1","p2","p3","p4","p5"].map(n=>
    `<div class="post"><div class="ph"><img src="img/${n}.jpg" alt=""></div></div>`).join("")}</div>
  </section>`;}
function render(){nav();({week,ask,refused,library})[view]();window.scrollTo(0,0);}
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-v]"); if(v){view=v.dataset.v;render();return;}
  const a=e.target.closest("[data-ask]");
  if(a){const id=+a.dataset.ask;
    a.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("chosen"));
    a.classList.add("chosen"); el("d"+id).hidden=false;
    setTimeout(()=>{answered.add(id);nav();},900); return;}
  if(e.target.closest("[data-approve]")){POSTS.forEach(p=>{if(answered.has(p.id)||p.st==="ready")scheduled.add(p.id)});render();return;}
  const p=e.target.closest("[data-post]"); if(p){view="week";render();return;}
});
render();
</script></body></html>
