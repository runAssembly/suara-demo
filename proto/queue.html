<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suara — the queue</title>
<style>
@font-face{font-family:"PJS";src:url("fonts/PlusJakartaSans.ttf") format("truetype-variations");font-weight:200 800;font-display:swap}
@font-face{font-family:"Gloock";src:url("fonts/Gloock-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
:root{
  --cream:#FBF6EF; --paper:#fff; --ink:#141018; --ink2:#4a4450; --mut:#6a6470;                 /* 5.32:1 on cream — #7a7480 was 4.21 and failed */
  --coral:#FF5A2B;                /* a FILL colour only — 2.89:1 as text, never use it for words */
  --coral-ink:#C4340A;            /* the text-safe coral, 5.08:1 on cream */
  --coral-soft:#FFE7DE; --gold:#FFC24B; --gold-soft:#FFF3D9;
  --green:#1E7A55; --green-soft:#E4F2EB; --hair:#E9E1D6;
  --t:200ms cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:"PJS",system-ui,sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}

/* ---------- chrome: deliberately almost nothing ---------- */
.bar{display:flex;align-items:center;gap:11px;padding:18px 22px 10px}
.bar svg{width:30px;height:30px}
.bar b{font-family:"Gloock",Georgia,serif;font-weight:400;font-size:20px;letter-spacing:0}
.bar .who{font-size:13px;color:var(--mut);margin-left:auto;text-align:right;line-height:1.3}
.prog{display:flex;gap:5px;padding:6px 22px 0}
.prog i{height:3px;flex:1;border-radius:99px;background:var(--hair)}
.prog i.on{background:var(--coral)}
.prog i.seg-done{background:var(--ink)}

/* ---------- the card: one decision, full width, nothing else ---------- */
main{flex:1;padding:14px 22px 130px;display:flex;flex-direction:column}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--coral-ink)}
h1{font-family:"Gloock",Georgia,serif;font-weight:400;letter-spacing:-.02em;line-height:1.06;
  font-size:clamp(32px,8.6vw,42px);margin-top:14px}
.lede{color:var(--ink2);margin-top:14px;font-size:16.5px;max-width:34ch}
.why{background:var(--paper);border:1px solid var(--hair);border-radius:20px;padding:18px 20px;margin-top:22px}
.why .k{font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.why p{margin-top:9px;font-size:15.5px;color:var(--ink2)}
.why .quote{font-family:"Gloock",Georgia,serif;font-size:19px;color:var(--ink);line-height:1.35;margin-top:4px}

/* answers — big, thumb-sized, one per row */
.answers{margin-top:26px;display:grid;gap:11px}
.ans{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:16px 20px;
  border:1px solid var(--hair);border-radius:18px;background:var(--paper);color:var(--ink);
  font:inherit;font-weight:600;text-align:left;cursor:pointer;transition:transform var(--t),border-color var(--t),background-color var(--t)}
.ans:hover{border-color:var(--ink)}
.ans:active{transform:scale(.985)}
.ans .dot{width:10px;height:10px;border-radius:99px;background:var(--coral);flex:0 0 10px}
.ans small{display:block;font-weight:500;font-size:13.5px;color:var(--mut);margin-top:2px}
.ans--type{color:var(--mut);font-weight:500}

/* the consequence — what answering just did */
.conseq{margin-top:20px;border-radius:18px;padding:16px 18px;font-size:14.5px;
  background:var(--green-soft);color:#14503a;border:1px solid #c9e3d7;display:none}
.conseq.on{display:block}

/* ---------- bottom action, always reachable by thumb ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 22px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(251,246,239,0),var(--cream) 32%);max-width:460px;margin:0 auto}
.go{width:100%;min-height:58px;border:none;border-radius:18px;background:var(--ink);color:var(--cream);
  font:inherit;font-weight:700;font-size:17px;cursor:pointer;transition:transform var(--t)}
.go:active{transform:scale(.99)}
.go--coral{background:var(--coral);color:var(--ink)}   /* ink on coral is 6.04:1; white was 3.11 and failed */
.skip{display:block;width:100%;margin-top:9px;background:none;border:none;color:var(--mut);
  font:inherit;font-size:14.5px;padding:10px;cursor:pointer}

/* ---------- the approve list ---------- */
.item{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--hair)}
.item:last-child{border:none}
.item img{width:62px;height:62px;border-radius:14px;object-fit:cover;flex:0 0 62px;background:#eee}
.item b{font-size:15.5px;display:block}
.item p{font-size:14px;color:var(--ink2);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .day{font-size:12.5px;color:var(--mut);margin-top:5px}
.tick{width:30px;height:30px;border-radius:99px;border:1px solid var(--hair);background:var(--paper);
  flex:0 0 30px;display:grid;place-items:center;cursor:pointer;margin-left:auto}
.tick.on{background:var(--green);border-color:var(--green)}
.tick.on::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- done ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:40px 0}
.done .mark{width:64px;height:64px;border-radius:99px;background:var(--green-soft);display:grid;
  place-items:center;margin-bottom:22px}
.done .mark::after{content:"";width:18px;height:9px;border-left:2.5px solid var(--green);
  border-bottom:2.5px solid var(--green);transform:rotate(-45deg) translate(2px,-2px)}
.done h1{margin-top:0}
.later{margin-top:30px;width:100%;border-top:1px solid var(--hair);padding-top:20px}
.later .k{font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);
  text-align:left}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:15px 2px;border-bottom:1px solid var(--hair);
  background:none;border-left:none;border-right:none;border-top:none;font:inherit;text-align:left;cursor:pointer}
.row b{font-weight:600;font-size:16px}
.row span{margin-left:auto;color:var(--mut);font-size:14px}
</style></head><body>
<div class="app">
  <div class="bar">
    <svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="w" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A2B"/><stop offset="1" stop-color="#FFC24B"/></linearGradient></defs>
      <g fill="none" stroke="url(#w)" stroke-linecap="round" transform="translate(256 364)">
      <path d="M -46 0 A 46 46 0 0 1 46 0" stroke-width="34"/><path d="M -104 0 A 104 104 0 0 1 104 0" stroke-width="30"/>
      <path d="M -160 0 A 160 160 0 0 1 160 0" stroke-width="26"/><path d="M -214 0 A 214 214 0 0 1 214 0" stroke-width="22"/></g></svg>
    <b>Suara</b><div class="who">Melur Kopi<br>Bangsar</div>
  </div>
  <div class="prog" id="prog"></div>
  <main id="main"></main>
  <div class="dock" id="dock"></div>
</div>
<script>
const POSTS=[
 {img:"img/p3.jpg",day:"Wednesday 7:15am",cap:"Kaya toast and two soft eggs, the way it has always been. We open at seven."},
 {img:"img/p5.jpg",day:"Wednesday 4:30pm",cap:"Second half of the day. The grinder is still going and there is one more cup in it."},
 {img:"img/p1.jpg",day:"Thursday 3:00pm",cap:"Same beans, same hands, same corner of Bangsar."},
 {img:"img/p2.jpg",day:"Friday 9:00am",cap:"Nasi lemak goes on at eight and stays until it doesn't."},
 {img:"img/p4.jpg",day:"Sunday 3:00pm",cap:"Quiet afternoon. The papers, a cup, nothing else needed."}];
const QUESTIONS=[
 {eyebrow:"One of two",
  h:"Is the kaya still made in-house?",
  lede:"I want to say so on Wednesday, but I will not claim it unless you tell me.",
  k:"Because I nearly wrote",
  quote:"“Our kaya, made here every morning.”",
  why:"That is a claim about your kitchen. It is not in your file, so I stopped.",
  answers:[{t:"Yes, we make it here",s:"I will say so, plainly"},
           {t:"No, we buy it in",s:"I will never mention it"},
           {t:"Type a different answer",type:true}],
  conseq:"Wednesday's post now says it. The other four are unchanged."},
 {eyebrow:"Two of two",
  h:"What time does the nasi lemak actually run out?",
  lede:"You said it goes on at eight. People keep asking when it goes.",
  k:"Because I nearly wrote",
  quote:"“Get there early — it goes fast.”",
  why:"That is a scarcity claim. I do not write those unless they are true and you have said them.",
  answers:[{t:"Usually before noon",s:"I will say most mornings, not always"},
           {t:"It varies too much to say",s:"I will leave it out entirely"},
           {t:"Type a different answer",type:true}],
  conseq:"Friday's post now says most mornings it is gone before noon."}];
let step=0, approved=new Set();
const el=id=>document.getElementById(id);
function prog(){
  const total=QUESTIONS.length+1;
  el("prog").innerHTML=Array.from({length:total},(_,i)=>
    `<i class="${i<step?'seg-done':i===step?'on':''}"></i>`).join("");
}
function render(){
  prog();
  if(step<QUESTIONS.length) return question(QUESTIONS[step]);
  if(step===QUESTIONS.length) return approve();
  return done();
}
function question(q){
  el("main").innerHTML=`
    <div class="eyebrow">${q.eyebrow} · needs you</div>
    <h1>${q.h}</h1>
    <p class="lede">${q.lede}</p>
    <div class="why"><div class="k">${q.k}</div>
      <div class="quote">${q.quote}</div>
      <p>${q.why}</p></div>
    <div class="answers">${q.answers.map((a,i)=>
      `<button class="ans ${a.type?'ans--type':''}" data-ans="${i}">
        ${a.type?'':'<span class="dot"></span>'}
        <span><span>${a.t}</span>${a.s?`<small>${a.s}</small>`:''}</span></button>`).join("")}</div>
    <div class="conseq" id="conseq">${q.conseq}</div>`;
  el("dock").innerHTML=`<button class="skip" data-skip>Answer this later</button>`;
}
function approve(){
  el("main").innerHTML=`
    <div class="eyebrow">Ready to go out</div>
    <h1>Five posts claim nothing you haven't confirmed.</h1>
    <p class="lede">No prices, no comparisons, no halal wording. Every line traces back to your file.</p>
    <div style="margin-top:22px">${POSTS.map((p,i)=>
      `<div class="item"><img src="${p.img}" alt="">
        <div style="flex:1"><b>${p.day}</b><p>${p.cap}</p></div>
        <button class="tick ${approved.has(i)?'on':''}" data-tick="${i}" aria-label="approve"></button></div>`).join("")}</div>`;
  el("dock").innerHTML=`<button class="go go--coral" data-approve>Approve all five</button>
    <button class="skip" data-next>Not now</button>`;
}
function done(){
  el("main").innerHTML=`<div class="done">
      <div class="mark"></div>
      <h1>Nothing left for you.</h1>
      <p class="lede" style="text-align:center">Two answered, five approved. I will post them and tell you what happened.</p>
      <div class="later">
        <div class="k">If you want it</div>
        <button class="row"><b>The week</b><span>9 posts</span></button>
        <button class="row"><b>Your photos</b><span>5</span></button>
        <button class="row"><b>What went out before</b><span>47 posts · 6 held</span></button>
      </div></div>`;
  el("dock").innerHTML=`<button class="go" data-restart>Start again</button>`;
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-ans]");
  if(a){ document.querySelectorAll(".ans").forEach(x=>x.style.opacity=.4); a.style.opacity=1;
    a.style.borderColor="var(--ink)"; el("conseq").classList.add("on");
    el("dock").innerHTML=`<button class="go" data-next>Next</button>`; return; }
  const t=e.target.closest("[data-tick]");
  if(t){ const i=+t.dataset.tick; approved.has(i)?approved.delete(i):approved.add(i);
    t.classList.toggle("on"); return; }
  if(e.target.closest("[data-approve]")){ POSTS.forEach((_,i)=>approved.add(i)); step++; render(); return; }
  if(e.target.closest("[data-next]")||e.target.closest("[data-skip]")){ step++; render(); return; }
  if(e.target.closest("[data-restart]")){ step=0; approved.clear(); render(); return; }
});
render();
</script></body></html>
