<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suara — Melur Kopi, week of 24–30 Aug</title>
<style>
@font-face{font-family:PJS;src:url('fonts/PlusJakartaSans.ttf') format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:Gloock;src:url('fonts/Gloock-Regular.ttf') format('truetype');font-weight:400;font-display:swap}

:root{
  --cream:#FDF7EF; --cream2:#F6EFE6; --white:#fff;
  --ink:#1A1520; --ink-soft:#3B3145; --muted:#6B6270;
  --coral:#FF6A45; --coral-deep:#E24A28; --green:#26B37A; --marigold:#FFC24B;
  --line:rgba(26,21,32,.10);
  --line-strong:rgba(26,21,32,.22);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  --r-card:14px; --r-btn:8px;
  --t:150ms cubic-bezier(.2,.7,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:PJS,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  background:var(--cream2); color:var(--ink);
  font-size:16px; line-height:1.5;
  overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,194,75,.10), transparent 60%),
    repeating-linear-gradient(45deg, rgba(26,21,32,.020) 0 1px, transparent 1px 8px);
}
img{max-width:100%;display:block}
.img{outline:1px solid oklch(0 0 0 / 0.1); outline-offset:-1px}
button,input,textarea,select{font:inherit;color:inherit}
.ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.mono{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}

:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:2px}
.tap{min-height:44px}

/* ---------- app shell ---------- */
.app{position:relative;z-index:1;display:grid;gap:0;grid-template-columns:1fr;
     max-width:1560px;margin:0 auto;padding:0 14px 108px}
.rail{display:none}
.stage{min-width:0;padding-top:14px}
.panelcol{min-width:0}

@media (min-width:1100px){
  .app{grid-template-columns:236px minmax(420px,600px) minmax(360px,1fr);
       column-gap:26px;padding:0 26px 40px;align-items:start}
  .rail{display:block;position:sticky;top:0;height:100dvh;padding:22px 0 20px;
        display:flex;flex-direction:column;gap:14px}
  .stage{padding-top:22px;padding-bottom:40px}
  .panelcol{position:sticky;top:22px;max-height:calc(100dvh - 44px);overflow:auto;padding:22px 2px 24px 0}
}

/* ---------- rail ---------- */
.brandmark{display:flex;align-items:baseline;gap:8px}
.brandmark b{font-family:Gloock,Georgia,serif;font-weight:400;font-size:25px;letter-spacing:.01em}
.brandmark span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.railnav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;
  background:transparent;border:1px solid transparent;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:600;text-align:left}
.navbtn .ic{width:18px;height:18px;color:var(--ink-soft)}
.navbtn:hover{background:rgba(26,21,32,.05)}
.navbtn[aria-current="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.navbtn[aria-current="true"] .ic{color:var(--cream)}
.badge{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;
  min-width:24px;height:24px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;background:var(--coral);color:var(--ink)}
.badge[data-zero="1"]{background:rgba(26,21,32,.10);color:var(--ink-soft)}
.railfoot{margin-top:auto;font-family:var(--mono);font-size:10px;line-height:1.7;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}

/* ---------- mobile top bar + tab bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 10px}
@media (min-width:1100px){.topbar{display:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:var(--cream);border-top:1px solid var(--line-strong);
  box-shadow:0 -6px 24px rgba(26,21,32,.08);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:1100px){.tabbar{display:none}}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:transparent;border:0;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);position:relative;padding:6px 2px}
.tab .ic{width:20px;height:20px}
.tab[aria-current="true"]{color:var(--ink);font-weight:700}
.tab[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--ink)}
.tabdot[data-zero="1"]{background:rgba(26,21,32,.12);color:var(--ink-soft)}
.tabdot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--coral);color:var(--ink);font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono)}

/* ---------- paper ---------- */
.paperwrap{filter:drop-shadow(0 1px 0 rgba(26,21,32,.10)) drop-shadow(0 16px 26px rgba(26,21,32,.10))}
.tear{height:9px;background:var(--cream);
  --mA:linear-gradient(135deg,#0000 50%,#000 50%);
  --mB:linear-gradient(45deg,#000 50%,#0000 50%);
  -webkit-mask:var(--mA) 0 0/18px 9px repeat-x,var(--mB) 0 0/18px 9px repeat-x;
  mask:var(--mA) 0 0/18px 9px repeat-x,var(--mB) 0 0/18px 9px repeat-x}
.tear--b{transform:scaleY(-1)}
.paper{background:var(--cream);
  background-image:
    repeating-linear-gradient(90deg, rgba(26,21,32,.014) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(0deg, rgba(26,21,32,.010) 0 1px, transparent 1px 5px);
  padding:0 clamp(14px,4vw,26px) 4px}

/* receipt head */
.rhead{padding:20px 0 14px;text-align:center;border-bottom:2px dashed var(--line-strong)}
.rhead h1{margin:0;font-family:Gloock,Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1.05;letter-spacing:.005em}
.rhead .sub{margin-top:7px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.rmeta{display:flex;justify-content:space-between;gap:10px;padding:9px 0;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:1px dashed var(--line-strong)}

/* section labels */
.slab{display:flex;align-items:center;gap:9px;padding:18px 0 9px;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.slab .ic{width:15px;height:15px}
.slab .rule{flex:1;height:0;border-top:1px dashed var(--line-strong)}

/* ---------- needs you ---------- */
.needs{background:var(--coral);color:var(--ink);margin:6px calc(-1*clamp(14px,4vw,26px));
  padding:16px clamp(14px,4vw,26px) 18px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.needs h2{margin:0 0 3px;font-size:19px;font-weight:800;letter-spacing:-.01em}
.needs .nsub{margin:0 0 13px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.qcard{background:var(--white);border:1.5px solid var(--ink);border-radius:var(--r-card);padding:14px;margin-top:10px}
.qcard .qday{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.qcard h3{margin:4px 0 7px;font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.qcard p{margin:0 0 12px;font-size:14.5px;line-height:1.55;color:var(--ink-soft)}
.qcard p em{font-style:normal;background:var(--marigold);padding:1px 5px;border-radius:3px;color:var(--ink)}
.answers{display:flex;flex-wrap:wrap;gap:8px}
.abtn{flex:1 1 auto;min-height:44px;padding:10px 14px;border:1.5px solid var(--ink);border-radius:var(--r-btn);
  background:var(--white);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer}
.abtn:hover{background:var(--ink);color:var(--cream)}
.abtn:active{transform:scale(.96)}
.answered{display:flex;gap:10px;align-items:flex-start;background:var(--white);border:1.5px solid var(--ink);
  border-radius:var(--r-card);padding:12px 14px;margin-top:10px}
.answered .ic{width:19px;height:19px;margin-top:2px}
.answered b{display:block;font-size:14px}
.answered span{font-size:13.5px;color:var(--ink-soft)}
.needs-done{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:6px calc(-1*clamp(14px,4vw,26px));
  padding:16px clamp(14px,4vw,26px);background:var(--marigold);color:var(--ink);
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.needs-done p{margin:0;font-size:15px;font-weight:700;flex:1 1 240px}

/* ---------- post rows ---------- */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:64px 1fr;gap:13px;padding:15px 0;border-bottom:1px dashed var(--line-strong)}
.row:last-child{border-bottom:0}
.thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;background:var(--cream2)}
.rowhead{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:5px}
.rowday{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.today{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:var(--marigold);color:var(--ink);padding:3px 7px;border-radius:4px}
.cap{margin:0;font-size:15px;line-height:1.58;color:var(--ink)}
.rowmeta{margin-top:7px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rowacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}

/* status pills + stamps */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:5px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  border:1.5px solid var(--ink)}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill--posted{background:var(--green);color:var(--ink)}
.pill--ready{background:var(--marigold);color:var(--ink)}
.pill--scheduled{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.pill--held{background:var(--coral);color:var(--ink)}
.stamp{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  background:var(--coral);color:var(--ink);border:2px solid var(--ink);border-radius:4px;
  transform:rotate(-4deg);box-shadow:2px 2px 0 rgba(26,21,32,.18)}
.stamp .ic{width:14px;height:14px;stroke-width:2.4}
.stamp--big{font-size:13px;padding:7px 14px;transform:rotate(-5deg)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 16px;
  border-radius:var(--r-btn);border:1.5px solid var(--ink);background:var(--cream);color:var(--ink);
  font-size:14.5px;font-weight:700;cursor:pointer;transition:background var(--t),border-color var(--t)}
.btn .ic{width:17px;height:17px}
.btn:hover{background:rgba(26,21,32,.07)}
.btn:active{transform:scale(.96)}
.btn--ink{background:var(--ink);color:var(--cream)}
.btn--ink:hover{background:#000}
.btn--coral{background:var(--coral);color:var(--ink)}
.btn--coral:hover{background:var(--coral-deep)}
.btn--mari{background:var(--marigold);color:var(--ink)}
.btn--mari:hover{background:#F2AF2C}
.btn--ghost{background:transparent;border-color:var(--line-strong)}
.btn--ghost:hover{background:rgba(26,21,32,.06);border-color:var(--ink)}
.btn--sm{min-height:44px;padding:9px 13px;font-size:13.5px}
.btn--wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- totals ---------- */
.totals{padding:16px 0 6px;border-top:2px dashed var(--line-strong)}
.trow{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);padding:5px 0}
.trow .lead{flex:1;border-bottom:1.5px dotted var(--line-strong);transform:translateY(-4px)}
.trow b{color:var(--ink);font-size:13px}
.tsum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
  background:var(--ink);color:var(--cream);padding:13px 15px;border-radius:6px;
  font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.tsum span:last-child{font-size:17px}
.batchwrap{margin-top:14px}
.rfoot{text-align:center;padding:18px 0 22px}
.barcode{height:40px;margin:0 auto 9px;max-width:260px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,
   transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px,var(--ink) 14px 15px,transparent 15px 18px)}
.rfoot .code{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* ---------- done state ---------- */
.done{text-align:center;padding:30px 4px 26px}
.done .seal{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;background:var(--green);
  border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;transform:rotate(-6deg)}
.done .seal .ic{width:44px;height:44px;stroke-width:2.6;color:var(--ink)}
.done h2{margin:0 0 8px;font-family:Gloock,Georgia,serif;font-weight:400;font-size:29px;line-height:1.15}
.done p{margin:0 auto 18px;max-width:38ch;font-size:15.5px;line-height:1.6;color:var(--ink-soft)}

/* ---------- panel (detail / refusals) ---------- */
.panel{background:var(--cream)}
.panel .paper{padding:0 clamp(14px,4vw,22px) 4px}
.panelhead{display:flex;align-items:center;gap:10px;padding:14px 0 12px;border-bottom:2px dashed var(--line-strong)}
.panelhead .ptitle{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line-strong);border-radius:var(--r-btn);background:transparent;cursor:pointer;
  transition:background var(--t),border-color var(--t)}
.iconbtn:hover{background:rgba(26,21,32,.07);border-color:var(--ink)}
.iconbtn .ic{width:19px;height:19px}
.iconbtn:active{transform:scale(.96)}

.photowrap{position:relative;margin:14px 0 0;border-radius:10px;overflow:hidden}
.photowrap img{width:100%;aspect-ratio:1/1;object-fit:cover}
.wordmark{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:7px;
  background:var(--cream);color:var(--ink);border:1.5px solid var(--ink);border-radius:7px;padding:6px 10px}
.wordmark b{font-family:Gloock,Georgia,serif;font-weight:400;font-size:15px;line-height:1}
.wordmark span{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}

.field{margin-top:16px}
.flab{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
textarea.cap-edit{width:100%;min-height:150px;padding:13px;border:1.5px solid var(--line-strong);border-radius:10px;
  background:var(--white);font-size:15.5px;line-height:1.6;resize:vertical;color:var(--ink)}
textarea.cap-edit:focus{border-color:var(--ink)}
input[type=text].tin,textarea.tin{width:100%;padding:12px;border:1.5px solid var(--line-strong);border-radius:10px;
  background:var(--white);font-size:15px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:10px 13px;border:1.5px solid var(--ink);border-radius:var(--r-btn);
  background:var(--white);font-size:13.5px;font-weight:700;cursor:pointer}
.chip:hover{background:var(--ink);color:var(--cream)}
.chip[aria-pressed="true"]{background:var(--marigold)}
.chip:active{transform:scale(.96)}

.trace{list-style:none;margin:0;padding:0;border:1.5px solid var(--line-strong);border-radius:10px;overflow:hidden}
.trace li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:12px 13px;border-bottom:1px dashed var(--line-strong);background:var(--white)}
.trace li:last-child{border-bottom:0}
.trace .ic{width:18px;height:18px;margin-top:2px}
.trace b{font-size:14.5px;font-weight:700;display:block}
.trace span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.trace li.none{background:var(--marigold)}
.trace li.none span{color:var(--ink-soft)}

.pubrow{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1.5px solid var(--line-strong);
  border-radius:10px;background:var(--white);margin-bottom:8px}
.pubrow .ic{width:20px;height:20px}
.pubrow b{font-size:14.5px}
.pubrow small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pubrow .on{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;background:var(--green);color:var(--ink);border:1.5px solid var(--ink);padding:4px 8px;border-radius:5px}
.note{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:10px 0 0}

/* refusals */
.refuse{border:1.5px solid var(--ink);border-radius:var(--r-card);background:var(--white);padding:14px;margin-top:12px}
.refuse .claim{margin:0 0 9px;font-size:16.5px;font-weight:700;line-height:1.35;color:var(--ink-soft);
  text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:2px}
.refuse p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-soft)}
.refuse .stamp{margin-bottom:15px}

/* library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gcell{position:relative;padding:0;border:1.5px solid var(--line-strong);border-radius:10px;overflow:hidden;
  background:var(--white);cursor:pointer;aspect-ratio:1/1;transition:border-color var(--t)}
.gcell img{width:100%;height:100%;object-fit:cover}
.gcell:hover{border-color:var(--ink)}
.gcell[aria-pressed="true"]{border:3px solid var(--ink)}
.gtag{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;background:var(--cream);color:var(--ink);border:1px solid var(--ink);padding:3px 6px;border-radius:4px}
.upload{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;
  border:2px dashed var(--line-strong);border-radius:10px;aspect-ratio:1/1;cursor:pointer;background:transparent;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
  transition:border-color var(--t),background var(--t)}
.upload:hover{border-color:var(--ink);background:rgba(26,21,32,.04)}
.upload .ic{width:22px;height:22px}
.reflist{list-style:none;margin:0;padding:0}
.reflist li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line-strong)}
.reflist b{font-size:14.5px}
.reflist span{display:block;font-size:13.5px;color:var(--ink-soft)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(26,21,32,.55);display:flex;align-items:center;
  justify-content:center;padding:16px}
.modal{width:min(520px,100%);max-height:min(86dvh,760px);overflow:auto;background:var(--cream);
  border:2px solid var(--ink);border-radius:16px;padding:0 18px 18px}
.modalhead{position:sticky;top:0;background:var(--cream);display:flex;align-items:center;gap:10px;
  padding:16px 0 12px;border-bottom:2px dashed var(--line-strong);z-index:1}
.modalhead h2{margin:0;flex:1;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{padding:16px 13px;border:1.5px solid var(--ink);border-radius:10px;color:var(--ink)}
.sw b{display:block;font-size:15px}
.sw span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line-strong);font-size:14.5px}
.kv b{font-weight:700}
.locked{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:5px 9px;border-radius:5px}
.locked .ic{width:13px;height:13px}

/* ---------- toast ---------- */
#toastroot{position:fixed;left:0;right:0;bottom:74px;z-index:90;display:flex;justify-content:center;
  padding:0 14px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:var(--cream);
  padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:min(420px,100%);
  box-shadow:0 10px 30px rgba(26,21,32,.3)}
.toast .ic{width:17px;height:17px;flex:none}
@media (min-width:1100px){#toastroot{bottom:24px}}

/* ---------- mobile panel = full sheet ---------- */
@media (max-width:1099px){
  .panelcol{position:fixed;inset:0;z-index:70;background:var(--cream2);overflow:auto;
    padding:10px 14px 190px}
  .panelcol[hidden]{display:none}
  /* filter:drop-shadow would make this a containing block for the fixed action bar */
  .panelcol .paperwrap{max-width:640px;margin:0 auto;filter:none}
}
@media (min-width:1100px){
  .panelcol[hidden]{display:none}
}

/* sticky primary actions: thumb-reachable on a phone, inline on desktop */
.stickyacts{display:flex;gap:8px;margin-top:14px}
.stickyacts .btn{flex:1 1 auto}
@media (max-width:1099px){
  .stickyacts{position:fixed;left:0;right:0;bottom:56px;z-index:75;margin:0;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--cream);
    border-top:1.5px solid var(--line-strong);box-shadow:0 -6px 20px rgba(26,21,32,.10)}
}
/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.firstpaint .anim{animation:rise 260ms cubic-bezier(.2,.7,.3,1) both}
.firstpaint .anim:nth-child(2){animation-delay:40ms}
.firstpaint .anim:nth-child(3){animation-delay:80ms}
.firstpaint .anim:nth-child(4){animation-delay:120ms}
.enter{animation:rise 200ms cubic-bezier(.2,.7,.3,1) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .btn:active,.abtn:active,.chip:active,.iconbtn:active{transform:none}
}

/* ============================ HELPERS ============================ */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function ic(n,cls){return '<svg class="ic'+(cls?" "+cls:"")+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
function post(id){for(var i=0;i<POSTS.length;i++){if(POSTS[i].id===id)return POSTS[i];}return null;}
function counts(){
  var c={total:POSTS.length,held:0,ready:0,scheduled:0,posted:0};
  POSTS.forEach(function(p){c[p.status]++;});
  return c;
}
function announce(msg){var l=$("#live"); if(l){l.textContent=msg;}}
var toastTimer=null;
function toast(msg){
  var r=$("#toastroot");
  r.innerHTML='<div class="toast enter">'+ic("check")+'<span>'+esc(msg)+'</span></div>';
  announce(msg);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){r.innerHTML="";},2600);
}
function statusMark(p){
  if(p.status==="held")   return '<span class="stamp">'+ic("hand")+'Held</span>';
  if(p.status==="posted") return '<span class="pill pill--posted">'+ic("check")+'Posted</span>';
  if(p.status==="ready")  return '<span class="pill pill--ready">'+ic("dot")+'Ready</span>';
  return '<span class="pill pill--scheduled">'+ic("clock")+'Scheduled</span>';
}
function questionFor(pid){for(var i=0;i<QUESTIONS.length;i++){if(QUESTIONS[i].postId===pid)return QUESTIONS[i];}return null;}

/* ============================ WEEK VIEW ============================ */
function needsBlock(){
  var open=QUESTIONS.filter(function(q){return !q.answered;});
  var c=counts();
  if(open.length===0){
    if(c.ready===0){
      return '<section class="done anim">'+
        '<div class="seal">'+ic("check")+'</div>'+
        '<h2>That’s the week.</h2>'+
        '<p>Nine posts. Two already out, seven scheduled. Nothing is waiting on you, and nothing went out that you hadn’t confirmed.</p>'+
        '<button class="btn btn--ink" type="button" data-act="refusals">'+ic("nowrite")+'See what I didn’t write</button>'+
        '</section>';
    }
    return '<div class="needs-done anim">'+
      '<p>Nothing is waiting on you. Both questions answered.</p>'+
      '<button class="btn" type="button" data-act="batch">'+ic("check")+'Approve the '+c.ready+' that claim nothing</button>'+
      '</div>'+
      '<ul class="reflist anim">'+QUESTIONS.map(function(q){
        return '<li>'+ic("check")+'<div><b>'+esc(q.day)+' — you said “'+esc(q.answered.l)+'”</b>'+
               '<span>'+esc(q.answered.r)+'</span></div></li>';
      }).join('')+'</ul>';
  }
  var h='<section class="needs anim" id="needs">'+
        '<h2>Needs you</h2>'+
        '<p class="nsub mono">'+open.length+' question'+(open.length===1?"":"s")+' · about a minute</p>';
  QUESTIONS.forEach(function(q){
    if(q.answered){
      h+='<div class="answered">'+ic("check")+'<div><b>'+esc(q.day)+' — you said “'+esc(q.answered.l)+'”</b>'+
         '<span>'+esc(q.answered.r)+'</span></div></div>';
    }else{
      h+='<div class="qcard" data-q="'+q.id+'">'+
         '<div class="qday">'+esc(q.day)+'</div>'+
         '<h3>'+esc(q.q)+'</h3><p>'+q.body+'</p>'+
         '<div class="answers">'+
         q.answers.map(function(a,i){
           return '<button class="abtn" type="button" data-act="answer" data-q="'+q.id+'" data-i="'+i+'">'+esc(a.l)+'</button>';
         }).join("")+
         '</div></div>';
    }
  });
  h+='</section>';
  return h;

var lastFocused=null;
function openModal(kind){
  if(!lastFocused) lastFocused=document.activeElement;
  state.modal=kind; renderModal();
}
function renderModal(){
  var root=$("#modalroot");
  if(!state.modal){ root.innerHTML=""; return; }
  var back=state.modal!=="settings";
  root.innerHTML='<div class="scrim" data-scrim="1">'+
    '<div class="modal enter" role="dialog" aria-modal="true" aria-labelledby="modaltitle">'+
      '<div class="modalhead">'+
        (back?'<button class="iconbtn" type="button" data-modal="settings" aria-label="Back to settings">'+ic("back")+'</button>':'')+
        '<h2 id="modaltitle">'+esc(MODAL_TITLES[state.modal])+'</h2>'+
        '<button class="iconbtn" type="button" data-act="closemodal" aria-label="Close">'+ic("x")+'</button>'+
      '</div>'+modalBody(state.modal)+'</div></div>';
  var f=focusables(root);
  if(f.length) f[0].focus();
}
function closeModal(){
  state.modal=null; renderModal();
  if(lastFocused&&lastFocused.focus) lastFocused.focus();
  lastFocused=null;
}
function focusables(root){
  return $$('a[href],button:not([disabled]),input:not([type=hidden]):not(.sr),textarea,select,[tabindex]:not([tabindex="-1"])',root)
    .filter(function(e){
      return e.namespaceURI==="http://www.w3.org/1999/xhtml" &&
             (e.offsetParent!==null||e===document.activeElement);
    });
}
document.addEventListener("focusin",function(e){
  if(!state.modal) return;
  var root=$("#modalroot");
  if(root&&!root.contains(e.target)){
    var f=focusables(root); if(f.length) f[0].focus();
  }
});
document.addEventListener("keydown",function(e){
  if(!state.modal) {
    if(e.key==="Escape"&&state.panel){ closePanel(); }
    return;
  }
  if(e.key==="Escape"){ e.preventDefault(); closeModal(); return; }
  if(e.key!=="Tab") return;
  var f=focusables($("#modalroot")); if(!f.length) return;
  var first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  else if(!$("#modalroot").contains(document.activeElement)){ e.preventDefault(); first.focus(); }
});

/* ============================ RENDER ============================ */
var wide=window.matchMedia("(min-width:1100px)");
state.draft={};
function stashDraft(){
  $$("[data-capedit]").forEach(function(t){ state.draft[t.getAttribute("data-capedit")]=t.value; });
  var rn=$("#refnote"); if(rn) state.refNote=rn.value;
}
function capOf(p){ return (state.draft[p.id]!=null)?state.draft[p.id]:p.cap; }
function captureFocus(){
  var a=document.activeElement;
  if(!a||!a.id) return null;
  return {id:a.id,s:a.selectionStart,e:a.selectionEnd};
}
function restoreFocus(f){
  if(!f) return;
  var el=document.getElementById(f.id); if(!el) return;
  el.focus();
  if(f.s!=null&&el.setSelectionRange){ try{ el.setSelectionRange(f.s,f.e); }catch(_){} }
}
function effPanel(){ return state.panel || (wide.matches?{type:"refusals"}:null); }
function syncNav(){
  var active = (state.panel&&state.panel.type==="refusals")?"refusals":(state.view==="library"?"library":"week");
  $$("[data-nav]").forEach(function(b){
    var n=b.getAttribute("data-nav");
    if(n==="settings"||n==="needs"){ b.removeAttribute("aria-current"); return; }
    b.setAttribute("aria-current", n===active?"true":"false");
  });
  var c=counts();
  $$("[data-count='held']").forEach(function(el){
    el.textContent=c.held;
    el.setAttribute("data-zero", c.held===0?"1":"0");
    el.setAttribute("aria-label", c.held+" waiting on you");
  });
}
function renderPanelDom(){
  var p=effPanel(), col=$("#panelcol"), body=$("#panelbody");
  if(!p){ col.hidden=true; body.innerHTML=""; document.body.style.overflow=""; return; }
  col.hidden=false;
  document.body.style.overflow=(!wide.matches)?"hidden":"";
  body.innerHTML = p.type==="post" ? renderDetail(post(p.id)) : renderRefusals();
  var ta=$("[data-capedit]",body);
  if(ta){ var pp=post(p.id); ta.value=capOf(pp); }
}
function render(){
  stashDraft();
  var f=captureFocus();
  var centre=$("#centre");
  centre.innerHTML = state.view==="library" ? renderLibrary() : renderWeek();
  if(state.firstPaint){ centre.classList.add("firstpaint"); setTimeout(function(){centre.classList.remove("firstpaint");},700); state.firstPaint=false; }
  renderPanelDom();
  syncNav();
  wireFile();
  restoreFocus(f);
}
function wireFile(){
  var fi=$("#fileinput"); if(!fi) return;
  fi.onchange=function(){
    var file=fi.files&&fi.files[0]; if(!file) return;
    LIB.unshift({src:URL.createObjectURL(file),tag:"Yours",alt:"Photo you added: "+file.name});
    render(); toast("Added “"+file.name+"” to your photos.");
  };
}
function closePanel(){ state.panel=null; render(); }
function openPost(id){
  state.panel={type:"post",id:id}; render();
  var b=$("#panelbody [data-act='closepanel']"); if(b&&!wide.matches) b.focus();
}
function scrollToNeeds(){
  var n=$("#needs")||$(".needs-done")||$(".done");
  if(!n) return;
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  n.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
}

/* ============================ ACTIONS ============================ */
document.addEventListener("click",function(e){
  var sc=e.target;
  if(sc&&sc.hasAttribute&&sc.hasAttribute("data-scrim")){ closeModal(); return; }
  var t=e.target.closest?e.target.closest("[data-act],[data-nav],[data-modal]"):null;
  if(!t) return;

  if(t.hasAttribute("data-modal")){ openModal(t.getAttribute("data-modal")); return; }

  if(t.hasAttribute("data-nav")){
    var n=t.getAttribute("data-nav");
    if(n==="settings"){ openModal("settings"); return; }
    if(n==="week"){ state.view="week"; state.panel=null; state.pickFor=null; render(); window.scrollTo(0,0); return; }
    if(n==="library"){ state.view="library"; state.panel=null; render(); window.scrollTo(0,0); return; }
    if(n==="refusals"){ state.view="week"; state.panel={type:"refusals"}; render(); return; }
    if(n==="needs"){ state.view="week"; state.panel=null; render(); scrollToNeeds(); return; }
  }

  var act=t.getAttribute("data-act"), id=t.getAttribute("data-id"), p=id?post(id):null;

  if(act==="open"){ openPost(id); return; }
  if(act==="closepanel"){ closePanel(); return; }
  if(act==="closemodal"){ closeModal(); return; }
  if(act==="refusals"){ state.panel={type:"refusals"}; render(); return; }
  if(act==="toneeds"){ state.panel=null; state.view="week"; render(); scrollToNeeds(); return; }

  if(act==="answer"){
    var qid=t.getAttribute("data-q"), i=+t.getAttribute("data-i");
    for(var k=0;k<QUESTIONS.length;k++){
      if(QUESTIONS[k].id===qid){
        var q=QUESTIONS[k]; q.answered=q.answers[i];
        var hp=post(q.postId); if(hp&&hp.status==="held") hp.status="ready";
        render(); toast(q.day+" answered. "+q.answered.r); return;
      }
    }
    return;
  }
  if(act==="approve"){
    if(p&&p.status==="ready"){ p.status="scheduled"; render(); toast(p.day+" is scheduled."); }
    return;
  }
  if(act==="batch"){
    var n2=0; POSTS.forEach(function(x){ if(x.status==="ready"){ x.status="scheduled"; n2++; } });
    render(); toast(n2+" posts scheduled. Nothing in them claims anything.");
    window.scrollTo({top:0,behavior:"auto"});
    return;
  }
  if(act==="save"){
    var ta=$("#cap-"+id);
    if(ta){ p.cap=ta.value.trim()||p.cap; }
    delete state.draft[id];
    state.panel=null; render(); toast("Caption saved to "+p.day+".");
    return;
  }
  if(act==="rewrite"){
    var v=p.rw[+t.getAttribute("data-i")];
    var rta=$("#cap-"+id); if(rta) rta.value=v.t;   /* so stashDraft picks up the new text */
    p.cap=v.t; delete state.draft[id]; render(); toast("Rewritten — "+v.l.toLowerCase()+".");
    return;
  }
  if(act==="logo"){ p.logo=!p.logo; render(); toast(p.logo?"Wordmark on the photo.":"Wordmark removed."); return; }
  if(act==="usephoto"){ state.pickFor=id; state.view="library"; state.panel=null; render(); window.scrollTo(0,0); return; }
  if(act==="cancelpick"){ state.pickFor=null; render(); return; }
  if(act==="pickphoto"){
    var src=t.getAttribute("data-src");
    if(state.pickFor){
      var target=post(state.pickFor); target.img=src; state.pickFor=null; state.view="week";
      state.panel={type:"post",id:target.id}; render(); toast("Photo swapped on "+target.day+".");
    }else{
      state.selectedPhoto=(state.selectedPhoto===src)?null:src; render();
    }
    return;
  }
  if(act==="upfile"){ var fi=$("#fileinput"); if(fi) fi.click(); return; }
  if(act==="savenote"){
    var rn=$("#refnote"); state.refNote=rn?rn.value:"";
    toast(state.refNote.trim()?"Note saved to your references.":"Nothing to save yet.");
    return;
  }
  if(act==="connect"){ toast("This is a prototype — no Meta window will open."); return; }
  if(act==="download"){
    var host=$("#dl-"+id); if(!host) return;
    var blob=new Blob([p.cap+"\n\n— Melur Kopi · "+p.dstr+" · photo: "+p.img+"\n"],{type:"text/plain"});
    var url=URL.createObjectURL(blob);
    host.innerHTML='<div class="rowacts"><a class="btn btn--sm btn--ink" download="melur-kopi-'+id+'.txt" href="'+url+'">'+ic("down")+'Caption (.txt)</a>'+
      '<a class="btn btn--sm btn--ink" download="melur-kopi-'+id+'.jpg" href="'+p.img+'">'+ic("down")+'Photo (.jpg)</a></div>'+
      '<p class="note">Two real files, saved separately. Instagram wants them separately anyway.</p>';
    announce("Download links ready");
    return;
  }
});

document.addEventListener("input",function(e){
  if(e.target&&e.target.hasAttribute&&e.target.hasAttribute("data-capedit")){
    state.draft[e.target.getAttribute("data-capedit")]=e.target.value;
  }
});
if(wide.addEventListener) wide.addEventListener("change",function(){ render(); });

render();
</script>
