<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suara — Melur Kopi</title>
<style>
@font-face{
  font-family:"PJS";
  src:url("fonts/PlusJakartaSans.ttf") format("truetype-variations");
  font-weight:200 800; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"Gloock";
  src:url("fonts/Gloock-Regular.ttf") format("truetype");
  font-weight:400; font-style:normal; font-display:swap;
}

:root{
  --cream:#FDF7EF; --cream2:#F6EFE6; --paper:#ffffff;
  --ink:#1A1520; --ink-soft:#3B3145; --muted:#6B6270;
  --coral:#FF6A45; --coral-deep:#E24A28; --green:#26B37A; --marigold:#FFC24B;

  --hair:rgba(26,21,32,.10);
  --hair-strong:rgba(26,21,32,.18);

  --bd:3px solid var(--ink);
  --bd2:2.5px solid var(--ink);
  --sh:4px 4px 0 var(--ink);
  --sh-sm:3px 3px 0 var(--ink);
  --sh-lg:6px 6px 0 var(--ink);

  --r-card:20px;
  --r-in:8px;
  --pad:12px;

  --t:150ms cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PJS",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--ink);
  font-size:16px;
  line-height:1.5;
  font-weight:500;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;outline:1px solid oklch(0 0 0 / 0.1);outline-offset:-1px}
button,input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- focus ---------- */
:where(a,button,input,textarea,[tabindex]):focus-visible{
  outline:3px solid var(--ink);
  outline-offset:3px;
  border-radius:4px;
}
.on-dark:focus-visible{outline-color:var(--cream)}

/* ---------- type ---------- */
h1,h2,h3,h4{margin:0;line-height:1.08;letter-spacing:-.02em;font-weight:800}
.display{font-family:"Gloock",Georgia,serif;font-weight:400;letter-spacing:-.01em;line-height:1.02}
.eyebrow{
  font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  line-height:1.2;
}
.eyebrow--ico{display:flex;align-items:center;gap:7px}
.small{font-size:14px;line-height:1.45}
.muted{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{
  -webkit-appearance:none;appearance:none;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:48px;padding:12px 20px;
  border:var(--bd);border-radius:999px;
  background:var(--paper);color:var(--ink);
  font-weight:800;font-size:15px;letter-spacing:-.01em;
  box-shadow:var(--sh);
  cursor:pointer;
  text-align:center;
  transition:transform var(--t),box-shadow var(--t),background-color var(--t);
}
.btn:hover{background:var(--cream2)}
.btn:active{transform:translate(4px,4px) scale(.985);box-shadow:0 0 0 var(--ink)}
.btn--primary{background:var(--coral)}
.btn--primary:hover{background:var(--coral-deep)}
.btn--gold{background:var(--marigold)}
.btn--gold:hover{background:#F5B22F}
.btn--ink{background:var(--ink);color:var(--cream)}
.btn--ink:hover{background:#2A2233}
.btn--block{width:100%}
.btn--sm{min-height:44px;padding:10px 16px;font-size:14px;box-shadow:var(--sh-sm)}
.btn--sm:active{transform:translate(3px,3px) scale(.985)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}

.iconbtn{
  -webkit-appearance:none;appearance:none;
  width:48px;height:48px;flex:0 0 48px;
  display:inline-flex;align-items:center;justify-content:center;
  border:var(--bd);border-radius:999px;background:var(--paper);color:var(--ink);
  box-shadow:var(--sh-sm);cursor:pointer;
  transition:transform var(--t),box-shadow var(--t),background-color var(--t);
}
.iconbtn:hover{background:var(--cream2)}
.iconbtn:active{transform:translate(3px,3px) scale(.97);box-shadow:0 0 0 var(--ink)}

svg{display:block;flex:0 0 auto}

/* ---------- shell ---------- */
.shell{max-width:1400px;margin:0 auto;padding:0 16px 112px}

.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--cream);
  border-bottom:3px solid var(--ink);
}
.topbar__in{
  max-width:1400px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:12px;
}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark__sq{
  width:42px;height:42px;flex:0 0 42px;border:var(--bd2);border-radius:12px;
  background:var(--paper);display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.brandmark__sq svg{width:26px;height:26px}
.brandmark__txt{min-width:0}
.brandmark__name{font-family:"Gloock",Georgia,serif;font-size:21px;line-height:1;letter-spacing:.01em}
.brandmark__sub{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar__sp{margin-left:auto}

/* ---------- nav ---------- */
.nav{display:flex;gap:8px}
.navitem{
  -webkit-appearance:none;appearance:none;
  position:relative;
  display:flex;align-items:center;gap:9px;
  min-height:48px;padding:10px 16px;
  border:var(--bd2);border-radius:999px;background:var(--paper);color:var(--ink);
  font-weight:800;font-size:14px;cursor:pointer;box-shadow:var(--sh-sm);
  transition:background-color var(--t),transform var(--t),box-shadow var(--t);
}
.navitem:hover{background:var(--cream2)}
.navitem:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.navitem[aria-current="page"]{background:var(--ink);color:var(--cream)}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 6px;border-radius:999px;
  background:var(--coral);color:var(--ink);border:2px solid var(--ink);
  font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
}
.navitem[aria-current="page"] .badge{border-color:var(--cream)}

/* bottom nav (phone) */
.botnav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:var(--cream);border-top:3px solid var(--ink);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:none;
}
.botnav .nav{gap:6px}
.botnav .navitem{
  flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:6px 4px;
  border-radius:14px;font-size:11px;min-height:56px;box-shadow:none;letter-spacing:-.01em;
}
.botnav .navitem span.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.botnav .badge{
  position:absolute;top:2px;right:calc(50% - 26px);min-width:20px;height:20px;font-size:11.5px;
}

/* ---------- layout ---------- */
.cols{display:block}
.side{display:none}
main{min-width:0}

/* ---------- cards ---------- */
.card{
  border:var(--bd);border-radius:var(--r-card);background:var(--paper);
  box-shadow:var(--sh);padding:var(--pad);
}
.block{
  border:var(--bd);border-radius:var(--r-card);box-shadow:var(--sh);
  padding:18px;
}
.block--coral{background:var(--coral)}
.block--gold{background:var(--marigold)}
.block--green{background:var(--green)}
.block--cream{background:var(--cream2)}
.block--paper{background:var(--paper)}
.block--ink{background:var(--ink);color:var(--cream)}

.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- week ---------- */
.hero{
  border:var(--bd);border-radius:var(--r-card);box-shadow:var(--sh-lg);
  background:var(--marigold);padding:20px;margin:18px 0 14px;
}
.hero h1{font-size:clamp(30px,8.5vw,44px)}
.hero__meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally{
  display:inline-flex;align-items:center;gap:8px;
  border:var(--bd2);border-radius:999px;background:var(--paper);
  padding:7px 14px;font-weight:800;font-size:14px;
}
.tally b{font-variant-numeric:tabular-nums;font-size:17px}

.sectionhead{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin:26px 0 12px;
}
.sectionhead h2{font-size:20px}

.postlist{display:grid;gap:14px}

.post{
  border:var(--bd);border-radius:var(--r-card);box-shadow:var(--sh);
  background:var(--paper);
  padding:var(--pad);
  display:grid;gap:12px;
  text-align:left;
  width:100%;
  font:inherit;color:inherit;
  cursor:pointer;
  -webkit-appearance:none;appearance:none;
  transition:transform var(--t),box-shadow var(--t);
}
.post:hover{box-shadow:var(--sh-lg)}
.post:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.post--held{background:var(--coral)}
.post--ready{background:var(--marigold)}
.post--scheduled{background:var(--paper)}
.post--posted{background:var(--cream2)}
.post__top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.post__day{
  font-size:18px;font-weight:800;letter-spacing:-.02em;
}
.post__top{row-gap:8px}
.post__time{font-size:14px;font-weight:700}
.post__media{position:relative;border:var(--bd2);border-radius:var(--r-in);overflow:hidden;background:var(--cream2)}
.post__media img{aspect-ratio:16/10;object-fit:cover;width:100%}
.post__caption{font-size:15.5px;line-height:1.5;font-weight:500}
.post__foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:700}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  border:2px solid var(--ink);border-radius:999px;
  padding:4px 11px;font-size:12.5px;font-weight:800;line-height:1.25;
  background:var(--paper);color:var(--ink);
  letter-spacing:.01em;
}
.chip--ink{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chip--green{background:var(--green);color:var(--ink)}
.chip--coral{background:var(--coral);color:var(--ink)}
.chip--gold{background:var(--marigold);color:var(--ink)}

/* logo overlay drawn in DOM */
.wordmark{
  position:absolute;left:10px;bottom:10px;
  display:flex;align-items:center;gap:7px;
  background:var(--marigold);border:2.5px solid var(--ink);border-radius:999px;
  padding:5px 12px 5px 8px;
  box-shadow:2px 2px 0 var(--ink);
}
.wordmark__t{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);line-height:1}

/* ---------- needs you ---------- */
.q{border:var(--bd);border-radius:var(--r-card);box-shadow:var(--sh-lg);background:var(--coral);padding:20px}
.q h3{font-size:clamp(21px,5.4vw,27px);letter-spacing:-.025em}
.q__why{margin:12px 0 0;font-size:15.5px;line-height:1.5;font-weight:600}
.q__answers{display:grid;gap:10px;margin-top:18px}
.q--done{background:var(--marigold)}

/* ---------- detail ---------- */
.detailgrid{display:grid;gap:16px;align-items:start}
.figure{position:relative;border:var(--bd);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--sh);background:var(--cream2)}
.figure img{width:100%;aspect-ratio:4/3;object-fit:cover}

.field{
  width:100%;border:var(--bd2);border-radius:var(--r-in);background:var(--paper);
  padding:12px;font-size:16px;line-height:1.55;font-weight:500;
  resize:vertical;min-height:150px;color:var(--ink);
}
.field:focus{outline:3px solid var(--ink);outline-offset:2px}

.trace{display:grid;gap:8px;margin-top:12px}
.traceitem{
  display:flex;gap:10px;align-items:flex-start;
  border:2px solid var(--ink);border-radius:var(--r-in);
  background:var(--paper);padding:10px 12px;
}
.traceitem--none{background:var(--coral)}
.traceitem__c{font-weight:800;font-size:14.5px}
.traceitem__s{font-size:13.5px;font-weight:600}
.traceitem--none .traceitem__s{color:var(--ink)}

.pubrow{
  display:flex;align-items:center;gap:12px;
  border:2px solid var(--ink);border-radius:var(--r-in);background:var(--paper);
  padding:11px 12px;
}
.pubrow__n{font-weight:800;font-size:15px}
.pubrow__d{font-size:13px;font-weight:600;color:var(--muted)}

.note{
  border:2px dashed var(--ink);border-radius:var(--r-in);
  padding:10px 12px;font-size:14px;font-weight:600;background:var(--cream2);
}
.note[hidden]{display:none}

/* ---------- library ---------- */
.grid-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.photo{
  position:relative;padding:0;border:var(--bd2);border-radius:14px;overflow:hidden;
  background:var(--cream2);box-shadow:var(--sh-sm);cursor:pointer;
  -webkit-appearance:none;appearance:none;
  transition:transform var(--t),box-shadow var(--t);
}
.photo:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.photo img{aspect-ratio:1/1;object-fit:cover;width:100%}
.photo__tag{
  position:absolute;left:6px;top:6px;
  background:var(--ink);color:var(--cream);border-radius:999px;
  font-size:11px;font-weight:800;padding:3px 9px;letter-spacing:.04em;text-transform:uppercase;
}
.uploader{
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  border:3px dashed var(--ink);border-radius:14px;background:var(--cream2);
  aspect-ratio:1/1;cursor:pointer;font-weight:800;font-size:14px;text-align:center;padding:10px;
}
.uploader:hover{background:var(--marigold)}
.uploader input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.reflist{display:grid;gap:10px}
.refitem{
  display:flex;gap:11px;align-items:flex-start;
  border:2px solid var(--ink);border-radius:var(--r-in);background:var(--paper);padding:11px 12px;
}

/* ---------- refusals ---------- */
.refusal{border:var(--bd);border-radius:var(--r-card);box-shadow:var(--sh);background:var(--paper);overflow:hidden}
.refusal__head{background:var(--coral);padding:14px 16px;border-bottom:3px solid var(--ink)}
.refusal__claim{font-size:17px;font-weight:800;text-decoration:line-through;text-decoration-thickness:2.5px;letter-spacing:-.01em}
.refusal__why{padding:14px 16px;font-size:15px;line-height:1.5;font-weight:500}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:80;
  background:rgba(26,21,32,.55);
  display:flex;align-items:flex-end;justify-content:center;
  padding:0;
}
.scrim[hidden]{display:none}
.modal{
  width:100%;max-width:560px;max-height:92vh;overflow:auto;
  background:var(--cream);
  border:var(--bd);border-bottom:none;border-radius:22px 22px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}
.modal__head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal__head h2{font-size:24px;letter-spacing:-.025em}

.swatch{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:var(--r-in);padding:9px 12px;background:var(--paper)}
.swatch__d{width:30px;height:30px;border:2.5px solid var(--ink);border-radius:8px;flex:0 0 30px}
.kv{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair)}
.kv:last-child{border-bottom:none}
.kv dt{font-size:13.5px;font-weight:700;color:var(--muted);margin:0}
.kv dd{margin:0;font-weight:800;font-size:15px;text-align:right}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- view transitions ---------- */
.view[hidden]{display:none}
.view.enter{animation:viewin 180ms cubic-bezier(.22,.61,.36,1) both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.firstpaint>*{animation:cardin 260ms cubic-bezier(.22,.61,.36,1) both}
.firstpaint>*:nth-child(1){animation-delay:0ms}
.firstpaint>*:nth-child(2){animation-delay:40ms}
.firstpaint>*:nth-child(3){animation-delay:80ms}
.firstpaint>*:nth-child(4){animation-delay:120ms}
.firstpaint>*:nth-child(5){animation-delay:160ms}
.firstpaint>*:nth-child(n+6){animation-delay:200ms}
@keyframes cardin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scrim{animation:fadein 140ms ease-out both}
.scrim .modal{animation:sheetin 200ms cubic-bezier(.22,.61,.36,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetin{from{transform:translateY(18px)}to{transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-delay:0ms !important;transition-duration:1ms !important}
}

/* ---------- the mark as decoration ----------
   Two treatments, assigned by surface so each one actually reads:
   D (cream knock-out) on coral/green fields, B (ink spray tag) on marigold.
   Both live in layer 1; every other child of .deco is lifted to layer 2. */
.deco{position:relative;overflow:hidden}
.deco>*:not(.knock){position:relative;z-index:2}
.knock{
  position:absolute;z-index:1;pointer-events:none;
  right:-84px;top:-72px;width:330px;height:330px;
}
.knock--spray{right:-72px;top:-58px;width:310px;height:310px}
@media (min-width:720px){
  .knock{right:-96px;top:-84px;width:400px;height:400px}
  .knock--spray{right:-86px;top:-68px;width:380px;height:380px}
}

/* ---------- illustrated icons (raster, from the onboarding set) ---------- */
.pico{outline:none !important;display:block;flex:0 0 auto}
.icohead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.icohead>div{min-width:0}

/* ---------- chat thread ---------- */
.thread{display:grid;gap:10px;margin-top:14px}
.msg{max-width:min(46ch,90%);border:2px solid var(--ink);border-radius:16px;padding:10px 13px;
  font-size:15px;line-height:1.45;font-weight:500}
.msg--her{margin-left:auto;background:var(--marigold);border-bottom-right-radius:5px}
.msg--sys{background:var(--paper);border-bottom-left-radius:5px}
.msg__who{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:4px;color:var(--muted)}
.msg--her .msg__who{color:var(--ink-soft)}
.composer{display:flex;gap:10px;margin-top:14px;align-items:stretch}
.composer input{
  flex:1 1 auto;min-width:0;border:var(--bd2);border-radius:999px;background:var(--paper);
  padding:12px 18px;font-size:16px;font-weight:500;min-height:48px;
}
.composer input:focus{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- history ---------- */
.perf{display:grid;gap:14px}
.perfitem{border:var(--bd);border-radius:var(--r-card);box-shadow:var(--sh);background:var(--paper);
  padding:var(--pad);display:grid;gap:11px}
.perfitem__top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;row-gap:7px}
/* 2x2, not 4 across: at 4 across the word COMMENTS does not fit the cell at any column width
   this layout actually produces, and it broke out through its own border. */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:2px solid var(--ink);border-radius:var(--r-in);background:var(--cream2);
  padding:8px 6px;text-align:center;min-width:0;overflow:hidden}
.stat b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin-top:2px;white-space:nowrap}
.learn{display:grid;gap:10px;margin-top:12px}
.learnitem{display:flex;gap:11px;align-items:flex-start;border:2px solid var(--ink);
  border-radius:var(--r-in);background:var(--paper);padding:11px 13px}
.learnitem p{margin:0;font-size:15px;line-height:1.45;font-weight:500}

/* ---------- platform preview ---------- */
.pv{display:grid;gap:16px}
.pvcard{border:var(--bd2);border-radius:16px;background:var(--paper);overflow:hidden}
.pvcard__bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid var(--ink)}
.pvcard__av{width:36px;height:36px;flex:0 0 36px;border:2px solid var(--ink);background:var(--marigold);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.pv--ig .pvcard__av{border-radius:999px}
.pv--fb .pvcard__av{border-radius:9px}
.pvcard__h{font-weight:800;font-size:14.5px;line-height:1.2}
.pvcard__m{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
.pvcard img.shot{width:100%;object-fit:cover;display:block}
.pv--ig img.shot{aspect-ratio:1/1}
.pv--fb img.shot{aspect-ratio:4/3}
.pvacts{display:flex;align-items:center;gap:14px;padding:10px 12px}
.pvbody{padding:0 12px 12px;font-size:14px;line-height:1.5;font-weight:500}
.pvbody .hd{font-weight:800}

/* ---------- the four-arc mark, used as card decoration ----------
   D — cream knock-out, for the CORAL and GREEN fields.
   B — ink spray tag, for the MARIGOLD fields (cream on marigold washes out: 1.49:1 at full
       strength, so a knock-out there could only ever be a smudge).
   Opacities were picked to land every treatment at roughly the same measured 1.5:1 against
   its own field, so the mark is visible and can never rival ink text (which sits at 6.31+). */
const ARCS = `<path d="M -46 0 A 46 46 0 0 1 46 0" stroke-width="34"/>
    <path d="M -104 0 A 104 104 0 0 1 104 0" stroke-width="30"/>
    <path d="M -160 0 A 160 160 0 0 1 160 0" stroke-width="26"/>
    <path d="M -214 0 A 214 214 0 0 1 214 0" stroke-width="22"/>`;

let sprayN = 0;
/* D — knocked out of the card in cream */
function markKnock(op){
  return `<svg class="knock" viewBox="0 0 512 512" style="opacity:${op}" aria-hidden="true" focusable="false">
    <g fill="none" stroke="#FDF7EF" stroke-linecap="round" transform="translate(256 364)">${ARCS}</g></svg>`;
}
/* B — sprayed, rough-edged, rotated, in ink */
function markSpray(op, col){
  const id = "spray" + (++sprayN);
  return `<svg class="knock knock--spray" viewBox="0 0 512 512" style="opacity:${op};transform:rotate(-13deg)" aria-hidden="true" focusable="false">
    <defs><filter id="${id}" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter></defs>
    <g fill="none" stroke="${col}" stroke-linecap="round" filter="url(#${id})" transform="translate(256 364)">${ARCS}</g></svg>`;
}
/* REPORTED DEVIATION — the marigold spray is coral-deep, not ink.
   Ink over marigold desaturates it to khaki: #1A1520 @ .22 over #FFC24B composites to #CC9C41,
   which reads as a coffee stain rather than as a tag. That is structural, not a tuning problem —
   any neutral dark at low alpha over a saturated yellow goes muddy, and at .16 (the lowest
   opacity that still reads) it was dull rather than clean. Coral-deep takes its separation from
   HUE instead of from lightness, so it reads as sprayed and stays clean on gold.
   Set SPRAY_INK = true to go back to ink #1A1520 @ .16. */
const SPRAY_INK = false;
const MARK = {
  coral:  () => markKnock(0.55),                                    /* cream on coral  — 1.53:1 */
  green:  () => markKnock(0.45),                                    /* cream on green  — 1.52:1 */
  gold:   () => SPRAY_INK ? markSpray(0.16, "#1A1520")
                          : markSpray(0.30, "#E24A28")
};

/* illustrated PNG icons from the Suara onboarding set — decorative unless given an alt */
function pico(name, size, alt){
  return `<img class="pico" src="icons/${name}.png" width="${size}" height="${size}" alt="${alt ? esc(alt) : ""}"${alt ? "" : ' aria-hidden="true"'}>`;
}

];
const REPLY_FALLBACK = "I have got that. I will work it into next week's drafts — and if doing it would mean stating something that is not on your file, I will come back and ask instead of guessing.";

function replyFor(text){
  const t = String(text).toLowerCase();
  for (const r of REPLIES){ if (r.k.some(k => t.includes(k))) return r.t; }
  return REPLY_FALLBACK;
}

/* a caption is never allowed to be scrolled out of sight — grow the box to the text */
function autogrow(n){
  if (!n) return;
  n.style.height = "auto";
  if (n.scrollHeight > 0) n.style.height = (n.scrollHeight + 3) + "px";
}
function growAll(){ document.querySelectorAll("textarea.field").forEach(autogrow); }
document.addEventListener("input", e => {
  if (e.target.classList && e.target.classList.contains("field")) autogrow(e.target);
});

const STATUS = {
  held:      {word:"Needs you", icon:ico.ask,   chip:"chip--ink"},
  ready:     {word:"Ready",     icon:ico.pen,   chip:"chip--ink"},
  scheduled: {word:"Scheduled", icon:ico.check, chip:"chip--green"},
  posted:    {word:"Posted",    icon:ico.dot,   chip:"chip--ink"}
};

function statusChip(st){
  const s = STATUS[st];
  return `<span class="chip ${s.chip}">${s.icon(14)}${esc(s.word)}</span>`;
}

/* the illustrated icon is an ADDITION to the chip, never a replacement:
   status still carries a glyph, a word and a colour on its own */
const STATUSPIC = { held:"pn-lock", scheduled:"pn-cal" };
function statusMark(st){
  const p = STATUSPIC[st];
  return `<span style="margin-left:auto;display:inline-flex;align-items:center;gap:8px">${
    p ? pico(p, 24) : ""}${statusChip(st)}</span>`;
}

function wordmarkHTML(){
  return `<div class="wordmark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1520" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 14V10M9.5 17V7M14 20V4M18.5 15V9"/></svg><span class="wordmark__t">Melur Kopi</span></div>`;

      const cur = (state.view === n.id) || (state.view === "post" && n.id === "week");
      const b = n.badge && countHeld() > 0
        ? `<span class="badge num" aria-hidden="true">${countHeld()}</span>` : "";
      const a11y = n.badge ? ` aria-label="${esc(n.label)}${countHeld()>0 ? ", " + countHeld() + " waiting" : ""}"` : "";
      return `<button class="navitem" data-nav="${n.id}"${cur ? ' aria-current="page"' : ""}${a11y}>
        ${n.icon(isBot ? 20 : 18)}<span class="lbl">${esc(n.label)}</span>${b}</button>`;
    }).join("");

/* ============================ views ============================ */
function show(view){
  state.view = view;
  ["week","chat","post","library","history"].forEach(v => {
    const node = el("view-" + v);
    node.hidden = v !== view;
    node.classList.remove("enter");
  });
  const node = el("view-" + view);
  void node.offsetWidth;
  node.classList.add("enter");
  growAll();
  renderNav();
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
}

function openModal(name){
  const m = MODALS[name]();
  lastFocus = lastFocus || document.activeElement;
  const modal = el("modal");
  modal.className = "modal" + (m.wide ? " modal--wide" : "");
  const inSettings = ["brand","accounts","plan"].includes(name);
  modal.innerHTML = `
    <div class="modal__head">
      <h2 id="modalTitle">${esc(m.title)}</h2>
      <button class="iconbtn" style="margin-left:auto" id="modalClose" aria-label="Close">${ico.x(20)}</button>
    </div>
    ${inSettings ? `<div class="row" style="margin-bottom:14px"><button class="btn btn--sm" data-modal="menu">${ico.back(16)}All settings</button></div>` : ""}
    ${m.body}`;
  const scrim = el("scrim");
  scrim.hidden = false;
  document.body.style.overflow = "hidden";
  const f = focusables();
  (f[0] || modal).focus();
}

function closeModal(){
  el("scrim").hidden = true;
  el("modal").innerHTML = "";
  document.body.style.overflow = "";
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  lastFocus = null;
}

function focusables(){
  return Array.from(el("modal").querySelectorAll(
    'button, [href], input:not([type=file]), textarea, select, [tabindex]:not([tabindex="-1"])'
  )).filter(n => n.offsetParent !== null || n === document.activeElement);
}

document.addEventListener("keydown", e => {
  if (el("scrim").hidden) return;
  if (e.key === "Escape"){ e.preventDefault(); closeModal(); return; }
  if (e.key === "Tab"){
    const f = focusables();
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    else if (!el("modal").contains(document.activeElement)){ e.preventDefault(); first.focus(); }
  }
});

/* close on click (not mousedown) so the browser's own blur lands first
   and our focus restore is the last thing that happens */
el("scrim").addEventListener("click", e => { if (e.target === el("scrim")) closeModal(); });

/* ============================ interaction ============================ */
document.addEventListener("click", e => {

  const close = e.target.closest("#modalClose");
  if (close){ closeModal(); return; }

  const mo = e.target.closest("[data-modal]");
  if (mo){ openModal(mo.dataset.modal); return; }

  const sb = e.target.closest("#settingsBtn, #settingsBtn2");
  if (sb){ lastFocus = sb; openModal("menu"); return; }

  const nav = e.target.closest("[data-nav]");
  if (nav){
    const v = nav.dataset.nav;
    if (v === "library") state.pickingFor = null;
    if (v === "chat") renderChat();
    if (v === "library") renderLibrary();
    if (v === "history") renderHistory();
    show(v);
    return;
  }

  if (e.target.closest("#previewBtn")){
    lastFocus = e.target.closest("#previewBtn");
    openModal("preview");
    return;
  }

  const openPost = e.target.closest("[data-post]");
  if (openPost){
    state.openPostId = openPost.dataset.post;
    renderPost();
    show("post");
    return;
  }

  const ans = e.target.closest("[data-answer]");
  if (ans){
    const p = post(ans.dataset.answer);
    const a = p.q.answers[+ans.dataset.i];
    p.status = "ready";
    state.answered[p.id] = a.ack;
    state.thread.push({who:"her", text:a.label});
    state.thread.push({who:"sys", text:a.ack});
    render();
    say(a.ack + " " + countHeld() + " left needing you.");
    return;
  }

  if (e.target.closest("#batchBtn")){
    const n = countReady();
    posts.forEach(p => { if (p.status === "ready") p.status = "scheduled"; });
    render();
    if (countHeld() === 0) window.scrollTo({top:0, behavior:"auto"});
    say(n + " posts scheduled.");
    return;
  }

  if (e.target.closest("#approveBtn")){
    const p = post(state.openPostId);
    p.status = "scheduled";
    render();
    renderPost();
    say(p.day + " scheduled.");
    return;
  }

  if (e.target.closest("#saveBtn")){
    const p = post(state.openPostId);
    const v = el("capField").value.trim();
    if (!v){
      const n = el("saveNote"); n.hidden = false;
      n.textContent = "A caption cannot be empty. Nothing was saved.";
      return;
    }
    p.caption = v;
    p.active = "edited";
    render();
    renderPost();
    const n = el("saveNote");
    n.hidden = false;
    n.textContent = "Saved. The week now shows this wording.";
    say("Caption saved.");
    return;
  }

  const vb = e.target.closest("[data-variant]");
  if (vb){
    const p = post(state.openPostId);
    const k = vb.dataset.variant;
    if (k === "orig"){
      if (p.orig) p.caption = p.orig;
      p.active = "orig";
    } else {
      if (!p.orig) p.orig = p.caption;
      p.caption = p.variants[+k].text;
      p.active = +k;
    }
    render();
    renderPost();
    say("Caption rewritten.");
    return;
  }

  if (e.target.closest("#logoBtn")){
    const p = post(state.openPostId);
    p.logo = !p.logo;
    render();
    renderPost();
    say("Logo " + (p.logo ? "on" : "off") + ".");
    return;
  }

  if (e.target.closest("#swapBtn")){
    state.pickingFor = state.openPostId;
    renderLibrary();
    show("library");
    return;
  }

  if (e.target.closest("#cancelPick")){
    const id = state.pickingFor;
    state.pickingFor = null;
    state.openPostId = id;
    renderPost();
    show("post");
    return;
  }

  const ph = e.target.closest("[data-photo]");
  if (ph){
    const item = library.photos[+ph.dataset.photo];
    if (state.pickingFor){
      const p = post(state.pickingFor);
      p.img = item.src;
      state.openPostId = state.pickingFor;
      state.pickingFor = null;
      render();
      renderPost();
      show("post");
      say("Photo changed.");
    } else {
      const n = el("upNote");
      n.hidden = false;
      n.textContent = "“" + item.name + "” is in your library. Open a post and choose “Use a different photo” to put it on one.";
    }
    return;
  }

  if (e.target.closest("#dlBtn")){
    const p = post(state.openPostId);
    const n = el("dlNote");
    n.hidden = false;
    try {
      const blob = new Blob([p.day + " " + p.time + " — Melur Kopi\n\n" + p.caption + "\n\nPhoto: " + p.img + "\n"], {type:"text/plain"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "melur-" + p.id + ".txt";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      n.textContent = "Caption downloaded as melur-" + p.id + ".txt. The photo is not bundled in this prototype — it is " + p.img + " in your library.";
    } catch (err){
      n.textContent = "Your browser blocked the download. The caption is the text above; the photo is " + p.img + ".";
    }
    say("Download handled.");
    return;
  }

  if (e.target.closest("#saveNoteBtn")){
    state.refsNote = el("refNote").value;
    library.note = state.refsNote;
    const n = el("refNoteMsg");
    n.hidden = false;
    n.textContent = "Saved. I will read this before writing next week.";
    say("Note saved.");
    return;
  }

  if (e.target.closest("#reconnectBtn")){
    const n = el("connNote");
    n.hidden = false;
    n.textContent = "This is a prototype — no real Meta window opens. In the product this is one login that covers both accounts.";
    return;
  }
});

/* ---------- chat compose ---------- */
document.addEventListener("submit", e => {
  if (!e.target.closest("#chatForm")) return;
  e.preventDefault();
  const input = el("chatInput");
  const text = (input.value || "").trim();
  if (!text){
    input.focus();
    say("Type what you want changed first.");
    return;
  }
  state.thread.push({who:"her", text:text});
  state.thread.push({who:"sys", text:replyFor(text)});
  renderChat();
  const again = el("chatInput");
  if (again){ again.value = ""; again.focus(); }
  const th = el("thread");
  if (th && th.lastElementChild) th.lastElementChild.scrollIntoView({block:"nearest"});
  say("Sent. Suara replied.");
});

document.addEventListener("change", e => {
  if (e.target.id === "uploadInput"){
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    library.photos.push({src:URL.createObjectURL(f), name:f.name, own:true});
    renderLibrary();
    const n = el("upNote");
    n.hidden = false;
    n.textContent = "Added “" + f.name + "” to your photos.";
    say("Photo added.");
  }
});

/* ============================ boot ============================ */
window.addEventListener("resize", growAll);
render();
show("week");
</script>
</body>
</html>
